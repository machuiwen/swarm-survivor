<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Hive">
  <meta name="theme-color" content="#07060f">
  <meta name="description" content="A neon bug-swarm survivor game. Just move: your weapons fire on their own. Survive 15 minutes of the hive.">
  <title>Neon Hive Survivors</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2338f6ff' stroke-width='4'/%3E%3Cpath d='M32 20 L40 32 L32 44 L24 32 Z' fill='%23ff4fd8'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body class="boot">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><div id="lvl">Lv.1</div></div>
    <div id="hud-top">
      <div id="slots"></div>
      <div id="hud-mid">
        <div id="timer">00:00</div>
        <div id="kills"></div>
      </div>
      <div id="hud-right">
        <div id="coins"><img class="coin-ico" alt=""><span id="coin-n">0</span></div>
        <button id="btn-mute" class="icon-btn" data-i18n-aria="hud.mute"></button>
        <button id="btn-pause" class="icon-btn" data-i18n-aria="hud.pause"><span class="pause-bars"></span></button>
      </div>
    </div>
    <div id="bossbar" class="hidden">
      <div id="bossname"></div>
      <div class="bar"><div id="bossfill"></div></div>
    </div>
    <div id="combo" class="hidden"><span id="combo-n">0</span><span class="combo-l" data-i18n="hud.combo"></span></div>
    <div id="banner"></div>
  </div>

  <section id="s-title" class="screen">
    <div class="title-wrap">
      <div class="logo"><span class="l1" data-i18n="logo.l1">NEON HIVE</span><span class="l2" data-i18n="logo.l2">SURVIVORS</span></div>
      <div class="subtitle" data-i18n="logo.sub"></div>
      <div class="menu">
        <button id="b-start" class="btn big primary" data-i18n="menu.start"></button>
        <button id="b-chars" class="btn big" data-i18n="menu.chars"></button>
        <button id="b-shop" class="btn big" data-i18n="menu.shop"></button>
        <button id="b-ach" class="btn big" data-i18n="menu.ach"></button>
      </div>
      <div class="title-info">
        <div class="coin-line"><img class="coin-ico" alt=""><span id="t-coins">0</span></div>
        <div id="t-record" class="record"></div>
      </div>
      <div class="toggles">
        <button id="t-music" class="chip"></button>
        <button id="t-sfx" class="chip"></button>
        <button id="t-lang" class="chip lang" data-i18n="menu.lang" data-i18n-aria="menu.langAria"></button>
      </div>
      <div class="hint" id="t-hint"></div>
    </div>
  </section>

  <section id="s-chars" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="chars.title"></h2>
      <div id="char-list" class="char-list"></div>
      <div class="row-btns">
        <button id="c-back" class="btn" data-i18n="chars.back"></button>
        <button id="c-go" class="btn primary" data-i18n="chars.go"></button>
      </div>
    </div>
  </section>

  <section id="s-shop" class="screen hidden">
    <div class="panel wide">
      <div class="panel-head">
        <h2 data-i18n="shop.title"></h2>
        <div class="coin-line"><img class="coin-ico" alt=""><span id="shop-coins">0</span></div>
      </div>
      <p class="sub" data-i18n="shop.sub"></p>
      <div id="shop-list" class="shop-list"></div>
      <div class="row-btns">
        <button id="shop-refund" class="btn small ghost" data-i18n="shop.refund"></button>
        <button id="shop-back" class="btn primary" data-i18n="shop.back"></button>
      </div>
    </div>
  </section>

  <section id="s-ach" class="screen hidden">
    <div class="panel wide">
      <div class="panel-head">
        <h2 data-i18n="ach.title"></h2>
        <div id="ach-count" class="sub"></div>
      </div>
      <div id="ach-list" class="ach-list"></div>
      <div id="ach-stats" class="stat-grid"></div>
      <div class="row-btns"><button id="ach-back" class="btn primary" data-i18n="ach.back"></button></div>
    </div>
  </section>

  <section id="s-levelup" class="screen overlay hidden">
    <div class="lv-wrap">
      <div class="lv-title" data-i18n="lv.title"></div>
      <div class="lv-sub" data-i18n="lv.sub"></div>
      <div id="cards" class="cards"></div>
      <div class="lv-actions">
        <button id="b-reroll" class="btn small"></button>
      </div>
    </div>
  </section>

  <section id="s-chest" class="screen overlay hidden">
    <div class="chest-wrap">
      <div class="chest-glow"></div>
      <img id="chest-img" class="chest-img" alt="">
      <div class="chest-title" data-i18n="chest.title"></div>
      <div id="chest-items" class="chest-items"></div>
      <div id="chest-coins" class="chest-coins"></div>
      <button id="chest-ok" class="btn primary" data-i18n="chest.ok"></button>
    </div>
  </section>

  <section id="s-pause" class="screen overlay hidden">
    <div class="panel wide">
      <h2 data-i18n="pause.title"></h2>
      <div class="pause-cols">
        <div>
          <h3 data-i18n="pause.weapons"></h3>
          <div id="p-weapons" class="build-list"></div>
          <h3 data-i18n="pause.items"></h3>
          <div id="p-passives" class="build-list"></div>
        </div>
        <div>
          <h3 data-i18n="pause.stats"></h3>
          <div id="p-stats" class="stat-grid"></div>
          <h3 data-i18n="pause.settings"></h3>
          <div class="toggles left">
            <button id="p-music" class="chip"></button>
            <button id="p-sfx" class="chip"></button>
            <button id="p-nums" class="chip"></button>
            <button id="p-shake" class="chip"></button>
          </div>
        </div>
      </div>
      <div class="row-btns">
        <button id="p-quit" class="btn ghost" data-i18n="pause.quit"></button>
        <button id="p-resume" class="btn primary" data-i18n="pause.resume"></button>
      </div>
    </div>
  </section>

  <section id="s-over" class="screen hidden">
    <div class="panel wide">
      <h2 id="o-title"></h2>
      <div id="o-sub" class="sub"></div>
      <div id="o-stats" class="stat-grid big"></div>
      <h3 data-i18n="over.weaponDmg"></h3>
      <div id="o-weapons" class="dmg-list"></div>
      <div id="o-coins" class="coin-break"></div>
      <div id="o-ach" class="o-ach"></div>
      <div class="row-btns">
        <button id="o-home" class="btn" data-i18n="over.home"></button>
        <button id="o-shop" class="btn" data-i18n="over.shop"></button>
        <button id="o-again" class="btn primary" data-i18n="over.again"></button>
      </div>
    </div>
  </section>

  <div id="confirm" class="screen overlay confirm hidden" role="dialog" aria-modal="true">
    <div class="panel confirm-box">
      <p id="confirm-msg"></p>
      <div class="row-btns">
        <button id="confirm-no" class="btn" data-i18n="confirm.no"></button>
        <button id="confirm-yes" class="btn primary" data-i18n="confirm.yes"></button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
